<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <title>Zeyad Saleh — Staff Software Engineer at Apple</title>
    <meta
      name="description"
      content="Zeyad Saleh is a Staff Software Engineer at Apple leading media architecture for Apple Intelligence and driving the future of Siri."
    />
    <meta name="author" content="Zeyad Saleh" />
    <link rel="canonical" href="https://zeyadhazem.github.io/" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- The hero photo is the LCP element, but React renders it, so the preload
         scanner cannot see it in this markup. Preload only the AVIF: it is the
         first <source> in the <picture>, so AVIF-capable browsers reuse this
         exact response, and browsers without AVIF skip the preload entirely.
         imagesrcset/imagesizes must mirror the component's srcset/sizes exactly,
         or the browser preloads one width and then fetches another. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="%PUBLIC_URL%/ProfilePhoto-200.avif 200w, %PUBLIC_URL%/ProfilePhoto-400.avif 400w, %PUBLIC_URL%/ProfilePhoto-600.avif 600w, %PUBLIC_URL%/ProfilePhoto-800.avif 800w"
      imagesizes="(max-width: 480px) 200px, (max-width: 768px) 250px, (max-width: 1024px) 300px, 400px"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zeyad Saleh" />
    <meta property="og:url" content="https://zeyadhazem.github.io/" />
    <meta property="og:title" content="Zeyad Saleh — Staff Software Engineer at Apple" />
    <meta
      property="og:description"
      content="Leading media architecture for Apple Intelligence and driving the future of Siri."
    />
    <meta property="og:image" content="https://zeyadhazem.github.io/ProfilePhoto-800.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="1089" />
    <meta property="og:image:alt" content="Zeyad Saleh" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Zeyad Saleh — Staff Software Engineer at Apple" />
    <meta
      name="twitter:description"
      content="Leading media architecture for Apple Intelligence and driving the future of Siri."
    />
    <meta name="twitter:image" content="https://zeyadhazem.github.io/ProfilePhoto-800.jpg" />
    <meta name="twitter:image:alt" content="Zeyad Saleh" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
